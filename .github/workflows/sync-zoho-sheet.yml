name: Sync published Update Centre sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-zoho-sheet
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install openpyxl
      - name: Download published Zoho Sheet and export first worksheet to JSON
        run: |
          python - <<'PY'
          import io, json, urllib.request
          from openpyxl import load_workbook

          url = 'https://sheet.zohopublic.in/sheet/published/dgklm0af687d826af43d683efc73741ee946b?download=xlsx'
          request = urllib.request.Request(url, headers={'User-Agent': 'Furdeco-Update-Centre-Sync/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read()
          if not data or not data.startswith(b'PK'):
              raise SystemExit('Zoho did not return an XLSX file. Check that published-sheet downloads are enabled.')
          workbook = load_workbook(io.BytesIO(data), read_only=True, data_only=True)
          sheet = workbook[workbook.sheetnames[0]]
          rows = [[('' if cell is None else str(cell).strip()) for cell in row] for row in sheet.iter_rows(values_only=True)]
          while rows and not any(rows[-1]):
              rows.pop()
          if len(rows) < 2:
              raise SystemExit('The published worksheet is empty or contains only a header row.')
          raw_headers = rows[0]
          headers = []
          for index, value in enumerate(raw_headers):
              name = value.strip() or f'Column {index + 1}'
              base, suffix = name, 2
              while name in headers:
                  name = f'{base}_{suffix}'
                  suffix += 1
              headers.append(name)
          records = []
          for row in rows[1:]:
              row = row + [''] * (len(headers) - len(row))
              record = {headers[i]: (row[i] if i < len(row) else '') for i in range(len(headers))}
              if any(str(value).strip() for value in record.values()):
                  records.append(record)
          with open('updates.json', 'w', encoding='utf-8') as output:
              json.dump(records, output, ensure_ascii=False, indent=2)
              output.write('\n')
          print(f'Synced {len(records)} records from worksheet {sheet.title!r} to updates.json.')
          PY
      - name: Commit updated JSON if changed
        run: |
          if git diff --quiet -- updates.json; then
            echo 'No sheet changes to publish.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add updates.json
            git commit -m 'Sync latest updates from published Zoho Sheet'
            git push
          fi
