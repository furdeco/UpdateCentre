name: Sync Zoho Sheet to Update Centre
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: sync-zoho-sheet
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: pip install openpyxl
      - name: Download published Zoho workbook and export CSV
        run: |
          python - <<'PY'
          import urllib.request, openpyxl, csv, io, os, sys
          url = 'https://sheet.zohopublic.in/sheet/published/dgklm0af687d826af43d683efc73741ee946b?download=xlsx'
          req = urllib.request.Request(url, headers={'User-Agent':'Furdeco-UpdateCentre-GitHub-Actions/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = response.read()
          except Exception as e:
              print(f'Failed to download published Zoho workbook: {e}', file=sys.stderr); raise
          if not data.startswith(b'PK'):
              print('Zoho response does not look like an XLSX workbook. Check the published downloadable link.', file=sys.stderr)
              print(data[:300].decode('utf-8', 'replace'), file=sys.stderr)
              raise SystemExit(1)
          wb = openpyxl.load_workbook(io.BytesIO(data), read_only=True, data_only=True)
          ws = wb[wb.sheetnames[0]]
          os.makedirs('.', exist_ok=True)
          with open('updates.csv', 'w', encoding='utf-8-sig', newline='') as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  vals = ['' if v is None else v.isoformat(sep=' ') if hasattr(v, 'isoformat') else str(v) for v in row]
                  while vals and vals[-1] == '': vals.pop()
                  if any(v.strip() for v in vals): writer.writerow(vals)
          wb.close()
          print(f'Exported workbook to updates.csv from first worksheet; bytes={len(data)}')
          PY
      - name: Commit updated CSV if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.csv
          if git diff --cached --quiet; then
            echo 'No sheet changes to publish.'
          else
            git commit -m 'Sync live Zoho Sheet data'
            git push
          fi
